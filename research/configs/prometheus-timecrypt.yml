# TimeCrypt (encrypted) demo config.
#
# Prometheus's own rule evaluation and alerting are intentionally OFF here: there
# is no `rule_files:` and no `alerting: alertmanagers:`. Alerting is delegated to
# the standalone research/timecrypteval evaluator, which queries this server for
# the aggregation over encrypted data, decrypts the per-series aggregate with keys
# this server never holds, applies the threshold itself, and logs firing alerts.
# See research/docs/architecture-assumptions-and-decisions.md (decision #7).
#
# myapp runs in its default (encrypted) mode, so Prometheus only ever scrapes and
# stores TimeCrypt ciphertext for myapp_processed_ops (+ its timeID companion).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  # demo Go app: "myapp", two instances, each its own Hermes writer class. Both
  # expose TimeCrypt ciphertext (+ timeID) as enc_series{sid="..."}; their real
  # labels exist only in the encrypted index.
  #
  # Under HERMES=0 (see research/scripts/run.sh) the same two targets expose the
  # same ciphertext as myapp_processed_ops{job,instance} (+ its timeID companion)
  # instead, with their labels in the clear. This scrape config is unchanged
  # between the two modes: which series a target exposes is the target's choice.
  - job_name: myapp
    scrape_interval: 10s
    static_configs:
      - targets:
          - localhost:2112
          - localhost:2113
